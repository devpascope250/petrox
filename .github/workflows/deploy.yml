name: 🚀 Production Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.IKWIM_SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "🚀 Starting deployment..."

            cd /home/ikwim-api/htdocs/api.ikwim.com

            echo "🧠 Loading Node, pnpm and pm2..."
            # An SSH deploy runs a non-interactive shell, which skips ~/.bashrc,
            # so Node installed per user (nvm, fnm, pnpm's own) must be loaded here.
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            export PNPM_HOME="$HOME/.local/share/pnpm"
            export PATH="$PNPM_HOME:$HOME/.local/bin:$HOME/.fnm:/usr/local/bin:$PATH"
            command -v fnm >/dev/null && eval "$(fnm env)"
            for tool in node pnpm pm2; do
              command -v "$tool" >/dev/null || { echo "❌ $tool not found for $(whoami). Run 'which $tool' on the server and add its folder to PATH above."; exit 1; }
            done
            echo "node $(node --version), pnpm $(pnpm --version), pm2 $(pm2 --version)"

            if [ ! -d .git ]; then
              echo "❌ $(pwd) is not a git clone. Run git init / git remote add origin / git fetch once on the server."
              exit 1
            fi

            echo "📡 Fetching latest code..."
            git fetch origin main

            echo "🧹 Resetting tracked files..."
            git reset --hard origin/main

            echo "📦 Installing dependencies with pnpm..."
            pnpm install --frozen-lockfile

            echo "🗄️ Generating Prisma client..."
            pnpm prisma generate

            echo "🏗 Building project..."
            pnpm build

            echo "🔄 Reloading PM2..."
            pm2 reload ecosystem.config.js --env production || pm2 restart all

            echo "🧹 Cleaning backup..."
            rm -rf /tmp/ikwim-backup

            echo "✅ Deployment completed successfully!"